[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-ai-labelling"
version = "0.1.0"
description = "AI Watermark Embedding Tool for photos and videos."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "absl-py",
    "ffmpeg-python",
    "opencv-python-headless",
    "Pillow",
]

[tool.setuptools]
py-modules = [
    "watermark_embedder",
    "watermark_embedder_main",
]
